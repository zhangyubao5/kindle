<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Clock settings</title><style>body{font:18px Arial,sans-serif;max-width:600px;margin:30px auto;padding:0 20px;color:black;background:white}label{display:block;margin:24px 0}select,button{font:inherit;min-height:44px;padding:10px;max-width:100%;margin-top:8px}select{display:block}a{color:inherit}</style></head><body>
<h1>Clock settings</h1><form action="index.html">
<label>Time zone<select name="utcOffset" id="utcOffset"><option value="pacific" selected>Pacific time (PST/PDT, automatic)</option><option value="local">Device time zone</option></select></label>
<p><small>Pacific time adjusts for daylight saving automatically. Fixed UTC offsets do not.</small></p>
<label>Rotation<select name="rotation" id="rotation"><option value="auto" selected>Automatic landscape</option><option value="normal">No rotation</option><option value="ll">Landscape left</option><option value="lr">Landscape right</option><option value="up">Upside down</option></select></label>
<label>Night mode<select name="night" id="night"><option value="off">Off</option><option value="on">On</option><option value="22-06">22:00–06:00</option></select></label>
<button type="submit">Show clock &amp; words</button></form><p><a href="index.html">Back to dashboard</a></p>
<script>
(function () {
    var select = document.getElementById("utcOffset");
    for (var offset = -720; offset <= 840; offset += 15) {
        var absolute = Math.abs(offset), hour = Math.floor(absolute / 60), minute = absolute % 60;
        var value = (offset < 0 ? "-" : "+") + (hour < 10 ? "0" : "") + hour + ":" + (minute < 10 ? "0" : "") + minute;
        var option = document.createElement("option"); option.value = value; option.textContent = "UTC" + value; select.appendChild(option);
    }
    var names = ["utcOffset", "rotation", "night"];
    for (var i = 0; i < names.length; i++) {
        var match = new RegExp("[?&]" + names[i] + "=([^&#]*)").exec(window.location.search);
        if (match) { document.getElementById(names[i]).value = decodeURIComponent(match[1].replace(/\+/g, " ")); }
    }
}());
</script></body></html>
